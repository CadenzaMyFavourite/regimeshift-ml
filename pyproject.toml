[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regimeshift-ml"
version = "0.1.0"
description = "Causal replay experiments for adaptive blending of frozen financial forecasting models"
requires-python = ">=3.11,<3.12"
dependencies = [
  "polars>=1.30,<2", "pyarrow>=18,<25", "numpy>=2,<3", "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2", "lightgbm>=4.5,<5", "matplotlib>=3.9,<4",
  "joblib>=1.4,<2", "pyyaml>=6,<7", "threadpoolctl>=3,<4", "nbformat>=5,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
notebook = ["jupyterlab>=4,<5", "nbformat>=5,<6", "nbclient>=0.10,<1", "nbconvert>=7,<8", "ipykernel>=6,<8"]

[project.scripts]
regimeshift = "regimeshift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regimeshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
